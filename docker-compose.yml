# Hood CMS — local dev stack: the Hood.Development web host + SQL Server.
# Quick start:  pnpm hood up            (from projects/Hood.Development — wraps this compose)
# Raw compose:  cp .env.example .env.local && docker compose --env-file .env.local up --build
#               (app on http://localhost:5070)
#
# The SA password is read from ${HOOD_SA_PASSWORD} — there are no hardcoded credentials here.
# `hood-dev` always supplies it (default + .env.local overlay); for raw `docker compose` you
# must provide it via --env-file .env.local (copied from .env.example) or your environment.
# See DOCKER.md for the full walkthrough.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hood-sqlserver
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${HOOD_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      # Host 14331 → container 1433, avoiding clashes with a native SQL Server
      # (1433) or other dev stacks.
      - "14331:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${HOOD_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - hood-network

  # One-shot: create an empty Hood.Web database so the app boots (it tolerates an
  # unseeded DB, but not a missing one). Schema + seed are applied separately (HOOD-53).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hood-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${HOOD_SA_PASSWORD}" -C
      -Q "IF DB_ID('Hood.Web') IS NULL CREATE DATABASE [Hood.Web];"
    networks:
      - hood-network
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hood-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Hood.Web;User Id=sa;Password=${HOOD_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      # Persist the Data Protection key ring so antiforgery tokens / auth cookies survive rebuilds.
      - Hood__DataProtectionKeyPath=/keys
    ports:
      # Host 5070 → container 8080 (avoids clashing with other local dev stacks).
      - "5070:8080"
    volumes:
      - hood-keys:/keys
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - hood-network
    restart: unless-stopped

networks:
  hood-network:
    driver: bridge

volumes:
  sqlserver-data:
  hood-keys:
    driver: local
