# Hood CMS — local dev stack: the Hood.Development web host + SQL Server.
# Quick start:  docker compose up --build   (app on http://localhost:5070)
# See DOCKER.md for the full walkthrough.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hood-sqlserver
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Hood_Dev_Passw0rd!
      - MSSQL_PID=Express
    ports:
      # Host 14331 → container 1433, avoiding clashes with a native SQL Server
      # (1433) or other dev stacks (bma-live uses 14330).
      - "14331:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Hood_Dev_Passw0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - hood-network

  # One-shot: create an empty Hood.Web database so the app boots (it tolerates an
  # unseeded DB, but not a missing one). Schema + seed are applied separately (HOOD-53).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hood-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Hood_Dev_Passw0rd!" -C
      -Q "IF DB_ID('Hood.Web') IS NULL CREATE DATABASE [Hood.Web];"
    networks:
      - hood-network
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hood-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Hood.Web;User Id=sa;Password=Hood_Dev_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True
    ports:
      # Host 5070 → container 8080 (bma-live uses 5050; keep Hood distinct).
      - "5070:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - hood-network
    restart: unless-stopped

networks:
  hood-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
