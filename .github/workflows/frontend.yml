name: Frontend

# Builds and publishes the `hoodcms` npm package (gulp build + view-copy).
# The npm version is derived from the same MinVer value as the NuGet packages so
# the two stay in lockstep:
#   • merge to master  → 7.0.0-rc.N  → npm dist-tag `next`
#   • GitHub Release v7.0.0 → 7.0.0   → npm dist-tag `latest`
# PRs build only (the publish job is gated on push/release).

on:
  # No paths filter on push: every merge to master publishes an RC so the npm and
  # NuGet prereleases stay in lockstep, regardless of which paths the merge touched.
  push:
    branches: [master]
  pull_request:
    paths:
      - 'projects/Hood.Development/src/**'
      - 'projects/Hood.Development/Views/**'
      - 'projects/Hood.Development/Themes/**'
      - 'projects/Hood.Development/gulpfile.cjs'
      - 'projects/Hood.Development/dev/**'
      - 'projects/Hood.Development/package.json'
      - 'projects/Hood.Development/pnpm-lock.yaml'
      - 'projects/Hood.Development/pnpm-workspace.yaml'
      - 'projects/Hood.Development/.npmrc'
      - 'projects/Hood.Development/tsconfig*.json'
      - '.github/workflows/frontend.yml'
  release:
    types: [published]

jobs:
  build:
    name: Build (pnpm run package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Hood.Development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: corepack enable # pins pnpm to the package.json "packageManager" field
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('projects/Hood.Development/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release # required by the npm trusted-publisher config
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm trusted publishing exchanges (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer (minver-cli) needs full history + tags
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install --global npm@latest
      # Same MinVer config as Directory.Build.props, so npm == NuGet version.
      - name: Compute version (MinVer)
        id: minver
        run: |
          dotnet tool install --global minver-cli --version 7.0.0
          VERSION="$("$HOME/.dotnet/tools/minver" --tag-prefix v --minimum-major-minor 7.0 --default-pre-release-identifiers rc)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
      - run: corepack enable # pins pnpm to the package.json "packageManager" field
        working-directory: projects/Hood.Development
      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: projects/Hood.Development
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('projects/Hood.Development/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
        working-directory: projects/Hood.Development
      - run: pnpm run package
        working-directory: projects/Hood.Development
      # No token: npm detects the GitHub OIDC environment, matches the trusted-publisher
      # config on npmjs, and publishes with provenance automatically.
      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: projects/Hood.Development
        run: |
          npm version "${{ steps.minver.outputs.version }}" --no-git-tag-version --allow-same-version
          if [ "${{ github.event_name }}" = "release" ]; then TAG=latest; else TAG=next; fi
          echo "Publishing hoodcms@${{ steps.minver.outputs.version }} with dist-tag $TAG"
          npm publish --tag "$TAG" --access public
